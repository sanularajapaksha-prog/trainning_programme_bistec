<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="#0f172a"/>

  <!-- Title -->
  <text x="550" y="34" fill="#f1f5f9" font-size="19" font-weight="700" text-anchor="middle">GreenChit — C4 Level 3 Component Diagram: Claims API</text>
  <text x="550" y="52" fill="#94a3b8" font-size="12" text-anchor="middle">Internal components of the Azure App Service (Node.js / Express)</text>

  <!-- Outer boundary box for Claims API -->
  <rect x="200" y="68" width="700" height="520" rx="10" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="550" y="88" fill="#86efac" font-size="11" text-anchor="middle">«Azure App Service» Claims API</text>

  <!-- Auth Middleware -->
  <rect x="340" y="100" width="180" height="80" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="120" fill="#93c5fd" font-size="10" text-anchor="middle">[Component]</text>
  <text x="430" y="137" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Auth Middleware</text>
  <text x="430" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">express-jwt + Entra JWKS</text>
  <text x="430" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">Validates JWT on every route</text>

  <!-- Claims Controller -->
  <rect x="220" y="240" width="180" height="80" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="260" fill="#86efac" font-size="10" text-anchor="middle">[Component]</text>
  <text x="310" y="277" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Claims Controller</text>
  <text x="310" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Express Router /claims</text>
  <text x="310" y="305" fill="#94a3b8" font-size="9" text-anchor="middle">CRUD + ownership check</text>

  <!-- Receipt Orchestrator -->
  <rect x="460" y="240" width="180" height="80" rx="7" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
  <text x="550" y="260" fill="#fdba74" font-size="10" text-anchor="middle">[Component]</text>
  <text x="550" y="277" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Receipt Orchestrator</text>
  <text x="550" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Signed URL generator</text>
  <text x="550" y="305" fill="#94a3b8" font-size="9" text-anchor="middle">SAS PUT URL · size/type check</text>

  <!-- Approval Engine -->
  <rect x="220" y="390" width="180" height="80" rx="7" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
  <text x="310" y="410" fill="#c4b5fd" font-size="10" text-anchor="middle">[Component]</text>
  <text x="310" y="427" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Approval Engine</text>
  <text x="310" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">State machine (pure fn)</text>
  <text x="310" y="455" fill="#94a3b8" font-size="9" text-anchor="middle">Draft→Submit→Approved/Rejected</text>

  <!-- Export Controller -->
  <rect x="700" y="240" width="170" height="80" rx="7" fill="#292524" stroke="#78716c" stroke-width="2"/>
  <text x="785" y="260" fill="#d6d3d1" font-size="10" text-anchor="middle">[Component]</text>
  <text x="785" y="277" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Export Controller</text>
  <text x="785" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Express Router /export</text>
  <text x="785" y="305" fill="#94a3b8" font-size="9" text-anchor="middle">Finance-only · 202 Accepted</text>

  <!-- Audit Writer -->
  <rect x="460" y="390" width="180" height="80" rx="7" fill="#1c1917" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="410" fill="#fcd34d" font-size="10" text-anchor="middle">[Component]</text>
  <text x="550" y="427" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Audit Writer</text>
  <text x="550" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">Append-only DB client</text>
  <text x="550" y="455" fill="#94a3b8" font-size="9" text-anchor="middle">INSERT-only user · audit schema</text>

  <!-- Notification Publisher -->
  <rect x="700" y="390" width="170" height="80" rx="7" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="785" y="410" fill="#6ee7b7" font-size="10" text-anchor="middle">[Component]</text>
  <text x="785" y="427" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Notif. Publisher</text>
  <text x="785" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">Service Bus SDK</text>
  <text x="785" y="455" fill="#94a3b8" font-size="9" text-anchor="middle">Publishes claim events async</text>

  <!-- Health Controller -->
  <rect x="340" y="520" width="180" height="60" rx="7" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="430" y="540" fill="#94a3b8" font-size="10" text-anchor="middle">[Component]</text>
  <text x="430" y="556" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Health Controller</text>
  <text x="430" y="569" fill="#94a3b8" font-size="9" text-anchor="middle">/health · /health/db</text>

  <!-- External: Web App (left) -->
  <rect x="20" y="170" width="150" height="60" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="95" y="193" fill="#93c5fd" font-size="10" text-anchor="middle">[External]</text>
  <text x="95" y="210" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Web App</text>
  <text x="95" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">React SPA</text>

  <!-- External: Azure SQL (bottom-left) -->
  <rect x="20" y="390" width="150" height="60" rx="7" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="95" y="413" fill="#c4b5fd" font-size="10" text-anchor="middle">[External]</text>
  <text x="95" y="430" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Azure SQL</text>
  <text x="95" y="444" fill="#94a3b8" font-size="9" text-anchor="middle">Claims + Audit schema</text>

  <!-- External: Blob Storage (top-right) -->
  <rect x="920" y="170" width="150" height="60" rx="7" fill="#7c2d12" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="995" y="193" fill="#fdba74" font-size="10" text-anchor="middle">[External]</text>
  <text x="995" y="210" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Blob Storage</text>
  <text x="995" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">Azure Blob</text>

  <!-- External: Service Bus (bottom-right) -->
  <rect x="920" y="390" width="150" height="60" rx="7" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="995" y="413" fill="#7dd3fc" font-size="10" text-anchor="middle">[External]</text>
  <text x="995" y="430" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Service Bus</text>
  <text x="995" y="444" fill="#94a3b8" font-size="9" text-anchor="middle">Azure Service Bus</text>

  <!-- ARROWS inside API -->
  <!-- Web App → Auth Middleware -->
  <line x1="170" y1="200" x2="338" y2="148" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="240" y="168" fill="#93c5fd" font-size="9">all requests / HTTPS</text>

  <!-- Auth Middleware → Claims Controller -->
  <line x1="380" y1="180" x2="340" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="338" y="218" fill="#93c5fd" font-size="9">passes</text>

  <!-- Auth Middleware → Receipt Orchestrator -->
  <line x1="480" y1="180" x2="520" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="490" y="218" fill="#93c5fd" font-size="9">passes</text>

  <!-- Auth Middleware → Export Controller -->
  <line x1="520" y1="148" x2="698" y2="270" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="618" y="198" fill="#93c5fd" font-size="9">finance role</text>

  <!-- Claims Controller → Approval Engine -->
  <line x1="310" y1="320" x2="310" y2="388" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="318" y="358" fill="#93c5fd" font-size="9">validates</text>

  <!-- Claims Controller → Audit Writer -->
  <line x1="400" y1="310" x2="460" y2="400" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="420" y="365" fill="#93c5fd" font-size="9">writes</text>

  <!-- Approval Engine → Azure SQL -->
  <line x1="220" y1="420" x2="170" y2="420" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="190" y="413" fill="#93c5fd" font-size="9">SQL/TDS</text>

  <!-- Audit Writer → Azure SQL -->
  <line x1="550" y1="470" x2="400" y2="450" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="480" y="470" fill="#93c5fd" font-size="9">INSERT-only</text>

  <!-- Receipt Orchestrator → Blob Storage -->
  <line x1="640" y1="280" x2="918" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="790" y="228" fill="#93c5fd" font-size="9">issues SAS URL</text>

  <!-- Notification Publisher → Service Bus -->
  <line x1="870" y1="430" x2="918" y2="420" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowA)"/>
  <text x="888" y="413" fill="#fcd34d" font-size="9">publishes</text>

  <!-- Export Controller → Notification Publisher -->
  <line x1="785" y1="320" x2="785" y2="388" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowA)"/>
  <text x="793" y="358" fill="#fcd34d" font-size="9">enqueues</text>
</svg>
